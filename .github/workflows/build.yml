# Public fork CI. Deliberately independent of upstream release/signing workflows.
name: Cast FASTDEV

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cast-fastdev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cast-fastdev:
    name: Cast core + framework (software only)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Install pinned Android build inputs
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0"

      - name: Source diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check HEAD^ HEAD

      - name: Cast unit tests and debug/release compile
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :play-services-cast-core:testDebugUnitTest \
            :play-services-cast-framework-core:testDebugUnitTest \
            :play-services-cast-core:compileDebugJavaWithJavac \
            :play-services-cast-core:compileReleaseJavaWithJavac \
            :play-services-cast-framework-core:compileDebugJavaWithJavac \
            :play-services-cast-framework-core:compileReleaseJavaWithJavac \
            --no-daemon

      - name: Cast debug/release lint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew \
            :play-services-cast-core:lintDebug \
            :play-services-cast-core:lintRelease \
            :play-services-cast-framework-core:lintDebug \
            :play-services-cast-framework-core:lintRelease \
            --no-daemon
